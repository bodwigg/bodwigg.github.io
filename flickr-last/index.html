<!doctype html>
<!--
	flickr-last – the latest photo uploaded to Flickr: the photo and its title, both linking to
	the photo on Flickr, on a background in the photo's own muted colour. Reads
	/flickr-archive/data/last.json, which the flickr-archive build writes every night
	(repo bodwigg/flickr-archive) - the colour included.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Latest photo – Ulf Bodin</title>
	<meta name="description" content="The latest photo uploaded to Flickr by Ulf Bodin.">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#202030">
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; }
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.2rem;
			min-height: 100vh;
			min-height: 100dvh;
			padding: clamp(0.75rem, 3vw, 2.5rem);
			background: var(--bg, #202030);
			color: #dddddd;
			transition: background-color 0.6s ease;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
		}
		a { color: inherit; text-decoration: none; }
		.photo { display: block; line-height: 0; }
		.photo img {
			display: block;
			max-width: 100%;
			max-height: calc(100vh - 7rem);
			max-height: calc(100dvh - 7rem);
			width: auto;
			height: auto;
			object-fit: contain;
		}
		.title {
			margin: 0;
			color: var(--text, #ffffff);
			font-size: clamp(1.1rem, 2.4vw, 1.6rem);
			font-weight: 500;
			letter-spacing: -0.02em;
			text-align: center;
		}
		.title a:hover, .title a:focus { color: #a0c776; }
		.title small { display: block; margin-top: 0.35rem; color: var(--muted, #8d8daa); font-size: 0.8rem; font-weight: 400; letter-spacing: 0; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<a class="photo" id="photo" href="https://www.flickr.com/photos/ulfbodin/" hidden><img id="img" alt=""></a>
	<h1 class="title"><a id="title" href="https://www.flickr.com/photos/ulfbodin/">Ulf Bodin on Flickr</a></h1>
	<script>
		(function () {
			var photo = document.getElementById('photo');
			var img = document.getElementById('img');
			var title = document.getElementById('title');
			fetch('/flickr-archive/data/last.json', { cache: 'no-cache' })
				.then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
				.then(function (p) {
					photo.href = title.href = p.url;
					img.src = p.src;
					img.srcset = p.medium + ' 1024w, ' + p.src + ' 2048w';
					img.sizes = '100vw';
					img.alt = p.title || '';
					if (p.ratio) img.style.aspectRatio = String(p.ratio);
					title.textContent = p.title || 'Untitled';
					var small = document.createElement('small');
					small.textContent = 'View on Flickr ↗';
					title.appendChild(small);
					document.title = (p.title || 'Latest photo') + ' – Ulf Bodin';
					// The background in the photo's own muted colour (computed by the flickr-archive build).
					if (p.colour) {
						var root = document.documentElement.style;
						root.setProperty('--bg', p.colour.bg);
						root.setProperty('--text', p.colour.text);
						root.setProperty('--muted', p.colour.muted);
						document.querySelector('meta[name="theme-color"]').content = p.colour.bg;
					}
					photo.hidden = false;
				})
				.catch(function () { /* the link to the photostream stays */ });
		})();
	</script>
</body>
</html>
